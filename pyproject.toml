[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatty-agent"
version = "0.4.0"
description = "AI Chatbot CLI with advanced sandboxed text and file system interaction"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "openai",
    "rich",
    "prompt-toolkit",
    "PyYAML",
    "json-repair",
    "psutil",
    "litellm",
    "pypdf",
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-rust",
]

[project.scripts]
chatty = "chatty.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chatty = ["skills/**/*", "landlock_exec.c"]


